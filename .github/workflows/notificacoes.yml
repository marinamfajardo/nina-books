name: Notificações diárias

# O GitHub costuma atrasar tarefas agendadas, então tentamos várias vezes dentro de cada janela;
# o script envia só uma vez por dia (controle no Supabase) e nunca fora do horário.
on:
  schedule:
    - cron: '7,27,47 12,13 * * *' # 9h–10h59 em Brasília: citação ou palavra do dia
    - cron: '7,27,47 0,1 * * *'   # 21h–22h59 em Brasília: "Saia do celular e vá ler"
  workflow_dispatch:
    inputs:
      tipo:
        description: 'manha ou noite (envio de teste, ignora o horário)'
        default: 'noite'

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save web-push@3
      - run: node scripts/send-push.mjs
        env:
          NINA_PUSH: ${{ secrets.NINA_PUSH }}
          TIPO: ${{ github.event.inputs.tipo }}
